<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Movies!</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #121214;
            padding: 20px;
        }

        article {
            background-color: #5650E0;
            border-radius: 10px;
            margin-bottom: 20px;
            padding: 15px;
            box-shadow: 0 2px 6px rgba(0, 0, 0, 0.2);
            transition: background-color 0.3s, transform 0.2s;
        }

        /* Hover-Effekt für die Box */
        article:hover {
            background-color: #6C63FF;
            transform: translateY(-5px);
        }

        /* Flexbox für Bild + Text nebeneinander */
        .movie-content {
            display: flex;
            gap: 20px;
            align-items: flex-start;
        }

        img {
            max-width: 200px;
            border-radius: 8px;
            flex-shrink: 0;
        }

        .movie-text {
            display: flex;
            flex-direction: column;
        }

        .genre {
            background-color: #007BFF;
            color: white;
            padding: 4px 8px;
            margin-right: 5px;
            border-radius: 5px;
            display: inline-block;
        }

        .actors,
        .directors {
            font-style: italic;
            margin-top: 5px;
            margin-bottom: 5px;
        }

        button {
            width: 220px;          /* feste Breite für alle Buttons */
            height: 55px;          /* feste Höhe */
            margin-top: 10px;
            font-size: 0.9rem;
            cursor: pointer;
            border: none;
            border-radius: 5px;
            background-color: #FFB800;
            color: #121214;
            transition: background-color 0.2s, transform 0.2s;
            text-align: center;    /* Text zentrieren */
            flex-shrink: 0;        /* Verhindert, dass Button kleiner wird */
        }

        /* Hover-Effekt für Button */
        button:hover {
            background-color: #FFA500;
            transform: scale(1.05);
        }
    </style>
    <script>
        window.onload = function () {
            const xhr = new XMLHttpRequest();
            xhr.onload = function () {
                const bodyElement = document.querySelector("body");
                if (xhr.status == 200) {
                    const movies = JSON.parse(xhr.responseText);

                    movies.forEach(movie => {
                        const article = document.createElement("article");

                        // Titel
                        const title = document.createElement("h2");
                        title.textContent = movie.Title;

                        // Container für Bild + Text
                        const contentDiv = document.createElement("div");
                        contentDiv.classList.add("movie-content");

                        // Bild
                        const img = document.createElement("img");
                        img.src = movie.Poster;

                        // Textcontainer
                        const textDiv = document.createElement("div");
                        textDiv.classList.add("movie-text");

                        // Plot
                        const plot = document.createElement("p");
                        plot.textContent = movie.Plot;

                        // Infos
                        const info = document.createElement("p");
                        info.textContent = "Released: " + movie.Released + " | Runtime: " + movie.Runtime + " min | Rating: " + movie.imdbRating;

                        // Genres
                        const genres = document.createElement("div");
                        movie.Genres.forEach(g => {
                            const span = document.createElement("span");
                            span.textContent = g;
                            span.classList.add("genre");
                            genres.appendChild(span);
                        });

                        // Actors
                        const actors = document.createElement("p");
                        actors.textContent = "Actors: " + movie.Actors.join(", ");
                        actors.classList.add("actors");

                        // Directors
                        const directors = document.createElement("p");
                        directors.textContent = "Directors: " + movie.Directors.join(", ");
                        directors.classList.add("directors");

                        // Button
                        const btn = document.createElement("button");
                        btn.textContent = "Click me!";
                        btn.onclick = () => alert("You clicked on " + movie.Title);

                        // Alles in den Textcontainer
                        textDiv.appendChild(plot);
                        textDiv.appendChild(info);
                        textDiv.appendChild(genres);
                        textDiv.appendChild(actors);
                        textDiv.appendChild(directors);
                        textDiv.appendChild(btn);

                        // Bild + Text in ContentDiv
                        contentDiv.appendChild(img);
                        contentDiv.appendChild(textDiv);

                        // Titel + ContentDiv ins Article
                        article.appendChild(title);
                        article.appendChild(contentDiv);

                        // Article an Body anhängen
                        bodyElement.appendChild(article);
                    });

                } else {
                    bodyElement.append("Daten konnten nicht geladen werden, Status " + xhr.status + " - " + xhr.statusText);
                }
            };
            xhr.open("GET", "/movies");
            xhr.send();
        };
    </script>
</head>

<body>
</body>

</html>
